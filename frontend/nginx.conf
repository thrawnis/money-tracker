server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # index.html — never cache so browsers always get the latest entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    # Hashed assets (JS, CSS) — cache aggressively, filenames change on each build
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else (images, fonts, favicon, etc.)
    location ~* \.(svg|ico|png|jpg|jpeg|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Route all other requests to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Import/export of larger files can take a while (the import path in
        # particular does several DB round-trips per row); the 60s default was
        # cutting the client connection while the backend kept processing and
        # eventually committed, making a slow-but-successful import look like
        # a failure — which invited a same-file retry and duplicate rows.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
