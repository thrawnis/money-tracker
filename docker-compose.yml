services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moneytracker
      POSTGRES_USER: moneytracker
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneytracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nightly pg_dump backups with 14-day retention. Restore with:
  #   gunzip -c data/backups/moneytracker-<date>.sql.gz | docker compose exec -T db psql -U moneytracker moneytracker
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: moneytracker
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: moneytracker
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./data/backups:/backups
    entrypoint: >
      sh -c 'while true; do
        ts=$$(date +%Y-%m-%d_%H%M);
        pg_dump | gzip > "/backups/moneytracker-$$ts.sql.gz" &&
          echo "backup written: moneytracker-$$ts.sql.gz";
        find /backups -name "moneytracker-*.sql.gz" -mtime +$$BACKUP_RETENTION_DAYS -delete;
        sleep 86400;
      done'
    depends_on:
      db:
        condition: service_healthy

  # Local Ollama — only started when OLLAMA_EXTERNAL_URL is not set.
  # rebuild.sh handles passing --profile local-ollama automatically.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: [local-ollama]
    volumes:
      - ./data/ollama:/root/.ollama
    # GPU passthrough (optional — remove if no NVIDIA GPU on the host)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Database=moneytracker;Username=moneytracker;Password=${DB_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      EncryptionKey: ${ENCRYPTION_KEY}
      Fido2__Domain: ${FIDO2_DOMAIN}
      Fido2__Origin: ${FIDO2_ORIGIN}
      # Receipt extraction provider: ollama (default) | anthropic | openai | gemini
      Receipt__Provider: ${RECEIPT_PROVIDER:-ollama}
      # Ollama: defaults to local container; set OLLAMA_EXTERNAL_URL to use an external server
      Receipt__Ollama__BaseUrl: ${OLLAMA_EXTERNAL_URL:-http://ollama:11434}
      Receipt__Ollama__Model: ${OLLAMA_MODEL:-llava}
      # Anthropic / Claude
      Receipt__Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      Receipt__Anthropic__Model: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      # OpenAI / ChatGPT (also works with any OpenAI-compatible API via OPENAI_BASE_URL)
      Receipt__OpenAi__ApiKey: ${OPENAI_API_KEY:-}
      Receipt__OpenAi__Model: ${OPENAI_MODEL:-gpt-4o-mini}
      Receipt__OpenAi__BaseUrl: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      # Google Gemini
      Receipt__Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Receipt__Gemini__Model: ${GEMINI_MODEL:-gemini-1.5-flash}
    ports:
      - "5012:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3012:80"
    depends_on:
      - api
