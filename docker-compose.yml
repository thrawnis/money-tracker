name: money-tracker

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moneytracker
      POSTGRES_USER: moneytracker
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneytracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nightly pg_dump backups with 14-day retention. Restore with:
  #   gunzip -c data/backups/moneytracker-<date>.sql.gz | docker compose exec -T db psql -U moneytracker moneytracker
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: moneytracker
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: moneytracker
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./data/backups:/backups
    entrypoint: >
      sh -c 'while true; do
        ts=$$(date +%Y-%m-%d_%H%M);
        pg_dump | gzip > "/backups/moneytracker-$$ts.sql.gz" &&
          echo "backup written: moneytracker-$$ts.sql.gz";
        find /backups -name "moneytracker-*.sql.gz" -mtime +$$BACKUP_RETENTION_DAYS -delete;
        sleep 86400;
      done'
    depends_on:
      db:
        condition: service_healthy

  # Local Ollama — started when the AI or receipt provider is ollama with no
  # server address set. rebuild.sh passes --profile local-ollama automatically.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: [local-ollama]
    volumes:
      - ./data/ollama:/root/.ollama
    # GPU passthrough (optional — remove if no NVIDIA GPU on the host)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    # Built by rebuild.sh directly with `docker buildx build` (Compose's own
    # `docker compose build` unreliably falls back to the legacy non-BuildKit
    # builder on this host, which chokes on the syntax directive and cache
    # mounts in backend/Dockerfile). Pinning this image name explicitly means
    # `docker compose up --no-build` picks up that image instead of trying
    # (and failing) to build its own, directory-derived one.
    image: money-tracker-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Database=moneytracker;Username=moneytracker;Password=${DB_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      EncryptionKey: ${ENCRYPTION_KEY}
      Fido2__Domain: ${FIDO2_DOMAIN}
      Fido2__Origin: ${FIDO2_ORIGIN}
      # Daily email digest (optional): SMTP server to send from
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
      Smtp__Security: ${SMTP_SECURITY:-starttls}
      Smtp__AllowInvalidCertificate: ${SMTP_ALLOW_INVALID_CERT:-false}
      # With email set up, accounts must verify their address to sign in; false turns that off
      Auth__RequireEmailVerification: ${REQUIRE_EMAIL_VERIFICATION:-true}
      # Address used for links in emails (defaults to the first FIDO2_ORIGIN)
      App__Url: ${APP_URL:-}
      # AI (see .env.example): one AI server for the assistant and receipt scanning…
      Ai__Provider: ${AI_PROVIDER:-}
      Ai__BaseUrl: ${AI_BASE_URL:-}
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__Model: ${AI_MODEL:-}
      # …unless receipts set their own (blank RECEIPT_PROVIDER = use the AI_* settings)
      Receipt__Provider: ${RECEIPT_PROVIDER:-}
      Receipt__BaseUrl: ${RECEIPT_BASE_URL:-}
      Receipt__ApiKey: ${RECEIPT_API_KEY:-}
      Receipt__Model: ${RECEIPT_MODEL:-}
      # Older per-provider receipt keys, still honoured as fallbacks (no longer in .env.example)
      Receipt__Ollama__BaseUrl: ${OLLAMA_EXTERNAL_URL:-http://ollama:11434}
      Receipt__Ollama__Model: ${OLLAMA_MODEL:-llava}
      Receipt__Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      Receipt__Anthropic__Model: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      Receipt__OpenAi__ApiKey: ${OPENAI_API_KEY:-}
      Receipt__OpenAi__Model: ${OPENAI_MODEL:-gpt-4o-mini}
      Receipt__OpenAi__BaseUrl: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      Receipt__Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Receipt__Gemini__Model: ${GEMINI_MODEL:-gemini-1.5-flash}
    volumes:
      - ./data/account-backups:/app/data/account-backups
      # Daily per-user backups (encrypted 7z), 7 kept per user
      - ./data/user-backups:/app/data/user-backups
    ports:
      - "5012:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    # See the api service's comment above — same reasoning applies here.
    image: money-tracker-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3012:80"
    depends_on:
      - api
